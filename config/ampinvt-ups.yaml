# ESPHome config for AMPINVT HT-800W12V UPS/inverter-charger monitoring
# via RS485 Modbus RTU, reporting into Home Assistant.
#
# Hardware:
#   - ESP32 dev board (tested on a "NodeMCU-32S" labelled ESP32-WROOM-32 board)
#   - HiLetgo TTL-to-RS485 UART module with automatic flow control
#   - AMPINVT HT-800W12V UPS/charger/inverter
#
# See ../README.md for wiring, register map, and what this model does /
# does not expose over Modbus. See ../FINDINGS.md for the full sweep
# methodology and results.

esphome:
  name: ampinvt-ups
  friendly_name: Ampinvt UPS

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# --- Wi-Fi ---
# Copy secrets.yaml.example to secrets.yaml (same folder) and fill in your
# own values. Never commit secrets.yaml.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Ampinvt-UPS Fallback"
    password: "fallback1234"

captive_portal:

ota:
  - platform: esphome

api:
  encryption:
    key: !secret api_key

logger:
  # UART0 (GPIO1/3) is reserved for this — not used for Modbus
  baud_rate: 115200

# --- RS485 link to the inverter ---
# RJ45 pin 1 (A+) -> RS485 module A+
# RJ45 pin 2 (B-) -> RS485 module B-
# RJ45 pin 8 (GND, labelled 接大地 on some boards) -> RS485 module GND
# RJ45 pin 6 carries ~18.5V on this unit and is NOT part of the RS485 pair.
# Never connect it — it will destroy a transceiver. See docs/wiring-diagram.svg.
#
# RS485 module VCC -> ESP32 3.3V
# RS485 module GND -> ESP32 GND
# RS485 module TXD -> ESP32 GPIO17
# RS485 module RXD -> ESP32 GPIO16
# (This particular auto-flow module needed straight, non-crossed TX/RX
# wiring to work — if you get zero responses, try swapping GPIO16/17.)
uart:
  id: modbus_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  stop_bits: 1

modbus:
  id: modbus_bus
  uart_id: modbus_uart

modbus_controller:
  id: ampinvt
  address: 0x01
  modbus_id: modbus_bus
  # The inverter should not be polled faster than ~1 Hz.
  update_interval: 5s

sensor:
  # --- Confirmed working input registers (function 0x04) ---
  - platform: modbus_controller
    modbus_controller_id: ampinvt
    name: "AC Input Voltage"
    register_type: read
    address: 0
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    value_type: U_WORD
    filters:
      - multiply: 0.1
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: ampinvt
    name: "AC Input Frequency"
    register_type: read
    address: 1
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    value_type: U_WORD
    filters:
      - multiply: 0.1
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: ampinvt
    name: "AC Output Voltage"
    register_type: read
    address: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    value_type: U_WORD
    filters:
      - multiply: 0.1
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: ampinvt
    name: "AC Output Frequency"
    register_type: read
    address: 3
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    value_type: U_WORD
    filters:
      - multiply: 0.1
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: ampinvt
    id: load_percentage
    name: "Load Percentage"
    register_type: read
    address: 6
    unit_of_measurement: "%"
    icon: "mdi:gauge"
    state_class: measurement
    value_type: U_WORD
    accuracy_decimals: 0
    # Fires Calculated Load the instant this value updates, rather than on
    # its own independent timer. The two were previously out of sync (e.g.
    # 23% showing alongside 208W / 152W instead of the correct 184W) because
    # the template sensor polled on its own 5s clock, drifting against this
    # sensor's own 5s Modbus poll cycle.
    on_value:
      then:
        - sensor.template.publish:
            id: calculated_load
            state: !lambda "return x * 8.0;"

  # Derived load estimation — now driven entirely by load_percentage's
  # on_value trigger above, not its own timer. No lambda/update_interval
  # needed here; sensor.template.publish sets the state directly.
  - platform: template
    name: "Calculated Load"
    id: calculated_load
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: ampinvt
    name: "Battery Voltage"
    register_type: read
    address: 7
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    value_type: U_WORD
    filters:
      - multiply: 0.1
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: ampinvt
    name: "Battery Capacity"
    register_type: read
    address: 9
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    value_type: U_WORD
    accuracy_decimals: 0

  # Operating status word (Input Register 32). Vendor-confirmed bit
  # assignments (see binary_sensor block below). One transitional value
  # observed and worth noting: during a grid-restore event, the word
  # briefly read 261 (0x105 = Grid Normal + Inverter Active + Output
  # Enabled, Charging bit NOT set) for a single ~5s poll cycle before
  # settling into steady-state 259 (Grid Normal + Charging + Output
  # Enabled). This contradicts an earlier assumption (sourced from another
  # HT-12212 owner's GitHub issue) that 261 represents a sustained
  # "Inverter Mode" state — on this unit it looks like a brief grid
  # hand-off transient, not a steady operating mode. See FINDINGS.md.
  - platform: modbus_controller
    modbus_controller_id: ampinvt
    id: ampinvt_status_word
    name: "Operating Status Word (raw)"
    register_type: read
    address: 32
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic

  # Event / Alarm code (Input Register 35)
  - platform: modbus_controller
    modbus_controller_id: ampinvt
    id: ampinvt_event_code
    name: "Event Code (raw)"
    register_type: read
    address: 35
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic

  # NOTE: "Inverter Working Mode Raw" (holding register 0x0007) and its
  # decoded text_sensor "Inverter Operating Mode" have been REMOVED.
  # That mapping came from an unofficial community source (another
  # HT-12212 owner's GitHub issue) rather than the vendor Modbus doc, and
  # on this unit it produced a value ("Inverter Mode (Battery)") directly
  # contradicting the vendor-confirmed status bits read at the same
  # moment (Grid Normal + Battery Charging both true, Inverter Active
  # false). See FINDINGS.md for details — labeled unconfirmed/likely
  # wrong for this model, pending a real test against a deliberate state
  # change (e.g. cutting AC input).

  # WiFi / Uptime diagnostics
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

binary_sensor:
  # Decoded from Register 32 — vendor-confirmed bit assignments
  # (Table 3.1.2 of the Foshan Jinguangyuan inverter Modbus protocol doc):
  # Bit0 = 市电正常 (Grid Normal), Bit1 = 充电运行中 (Battery Charging),
  # Bit2 = 逆变运行中 (Inverter Active), Bit8 = 输出开启 (Output Enabled)
  - platform: template
    name: "Grid Normal"
    device_class: plug
    lambda: |-
      if (id(ampinvt_status_word).has_state()) {
        return ((uint16_t)id(ampinvt_status_word).state & 0x0001) != 0;
      }
      return {};

  - platform: template
    name: "Battery Charging"
    device_class: battery_charging
    lambda: |-
      if (id(ampinvt_status_word).has_state()) {
        return ((uint16_t)id(ampinvt_status_word).state & 0x0002) != 0;
      }
      return {};

  - platform: template
    name: "Inverter Active"
    device_class: running
    lambda: |-
      if (id(ampinvt_status_word).has_state()) {
        return ((uint16_t)id(ampinvt_status_word).state & 0x0004) != 0;
      }
      return {};

  - platform: template
    name: "Output Enabled"
    device_class: power
    lambda: |-
      if (id(ampinvt_status_word).has_state()) {
        return ((uint16_t)id(ampinvt_status_word).state & 0x0100) != 0;
      }
      return {};

text_sensor:
  # Decoded from Register 35 — vendor-confirmed, word-for-word match
  # (Table 3.1.3 of the Foshan Jinguangyuan inverter Modbus protocol doc)
  - platform: template
    name: "Inverter Event and Alarm State"
    id: ampinvt_event_text
    icon: mdi:alert-circle-outline
    lambda: |-
      if (!id(ampinvt_event_code).has_state()) return std::string("Unknown");
      int code = (int) id(ampinvt_event_code).state;
      switch (code) {
        case 0: return std::string("Normal (No Event)");
        case 1: return std::string("Internal Overcurrent Protection");
        case 2: return std::string("Output Short Circuit Protection");
        case 3: return std::string("Output Overload Protection");
        case 4: return std::string("System Overtemperature Protection");
        case 5: return std::string("High Battery Voltage Protection");
        case 6: return std::string("Low Battery Voltage Protection");
        case 7: return std::string("Phase Sequence Error Warning");
        case 8: return std::string("Low Output Voltage Protection");
        case 9: return std::string("ECO Mode Active");
        default: return std::string("Unknown Code (" + std::to_string(code) + ")");
      }